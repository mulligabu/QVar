# engines.conf — THE single source of truth for every live forward engine's lane config.
# Format: name|data_dir|extra_flags   (lines starting with # are skipped)
#
# Read by BOTH live/boot_engines.sh (resume launcher, runs on boot) and
# live/restart_engines.sh (destructive fresh-reset). Never launch an engine with ad-hoc
# flags: every lane-defining flag is pinned EXPLICITLY here (no reliance on argparse
# defaults), and forward_engine.py persists launch_args.json per data dir and prints a loud
# CONFIG DRIFT warning if a relaunch changes the lane.
#
# Lanes:
#   main         CONTROL — the untouched reference engine. Mid-book maker (0.50–0.65),
#                raw sign(p_cal−mid) gate, zdist-gate on, both sides. Sacred baseline:
#                never change its behavior, so every A/B has a fixed reference.
#   conditional  per-(timeframe, mid-band) cell-skill gate (predictor.ConditionalSkill),
#                mid-band maker capped at 0.60 (0.60–0.65 fills are adversely selected).
#                Trades only cells that have earned drift-controlled skill, flipping the
#                side where the cell says the raw tilt is backwards.
#
# --md on is TRANSPORT only: consume the shared md_service stream (data/md.sock) with
# automatic REST fallback. Not a lane-defining flag, so it is absent from launch_args.json's
# config-drift guard by design. Default off here.
main|data/forward_live|--price-lo 0.50 --price-hi 0.65 --flat-size on --zdist-gate on --conditional-gate off --sides up,down
conditional|data/forward_live_conditional|--price-lo 0.50 --price-hi 0.60 --flat-size on --zdist-gate on --conditional-gate on --sides up,down
