[project]
name = "crypto-forward-prediction-engine"
version = "0.2.0"
requires-python = ">=3.12"
# The live engine is stdlib-only (urllib, sqlite3) — no runtime dependencies.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "live"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Full ruleset on live/ + tests/ (the code that must be reviewable before
# real-money execution); research/ scripts are exploratory one-offs.
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
    "E501",    # line length is advisory on legacy files (no formatter sweep yet)
    "E702",    # compact `a = x; b = y` one-liners are the established house idiom
    "RUF001",  # unicode em-dashes/arrows in comments/docstrings are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"research/**" = ["E701", "E702", "E703", "E401", "F541", "E722", "B", "UP", "I", "RUF", "F841"]
"tools/**" = ["E701", "E702", "F541"]

[tool.mypy]
python_version = "3.12"
files = ["live"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
